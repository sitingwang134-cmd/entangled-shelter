server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    charset utf-8;
    absolute_redirect off;

    location = / {
        return 302 /editions/winter2026;
    }

    location = /editions/winter2026/ {
        return 301 /editions/winter2026;
    }

    location = /editions/winter2026 {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
